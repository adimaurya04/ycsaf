<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, My Love</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>   
        :root {
            --primary-color: #d63384; 
            --soft-pink: #fce7f3; 
            --bg-gradient: linear-gradient(135deg, #fff0f5 0%, #e6e6fa 100%);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            color: #4a4a4a;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        h1, h2, h3 {
            font-family: 'Great Vibes', cursive;
            color: var(--primary-color);
        }

        

        /* Sticker Animation */
        .sticker-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; overflow: hidden;
        }
        .sticker {
            position: absolute; bottom: -50px; font-size: 2rem;
            animation: floatUp linear infinite; opacity: 0.6;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* Header */
        header {
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            min-height: 100vh;
        }

        .main-card-bg {
            background-image: url('https://png.pngtree.com/png-clipart/20240619/original/pngtree-blank-paper-text-box-template-design-with-love-icon-suitable-for-png-image_15369747.png');
            background-size: 100% 160%;
            background-repeat: no-repeat;
            background-position: center;
            width: 95%;              
            max-width: 1200px;       
            height: 75vh;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0 auto;
        }

        .title-glow {
            font-family: 'Dancing Script', cursive;
            font-size: 8vh;
            color: #d32f2f;
            text-shadow: 3px 3px 0px rgba(255, 255, 255, 0.6);
            margin: 0;
            line-height: 1.2;
            animation: pulse 3s infinite ease-in-out;
        }

        .subtitle-glow {
            font-family: 'Dancing Script', cursive;
            font-size: 5vh;
            color: #b71c1c;
            margin-top: 10px;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.6);
        }

        /* Navigation */
        .nav-container {
            display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;
            margin-top: 30px; margin-bottom: 40px;
        }
        .nav-btn {
            padding: 12px 30px; border-radius: 50px;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            font-size: 1.1rem; cursor: pointer;
            transition: all 0.3s ease; font-family: 'Nunito', sans-serif; font-weight: 600;
        }
        .nav-btn:hover, .nav-btn.active {
            background: var(--primary-color); color: white;
            transform: translateY(-3px); box-shadow: 0 10px 20px rgba(214, 51, 132, 0.3);
        }

        /* Sections */
        .content-section {
            display: none; max-width: 1200px; margin: 0 auto; padding: 40px 20px;
            animation: fadeIn 0.8s ease;
        }
        .content-section.active-section { display: block; }
        .section-title { font-size: 3.5rem; text-align: center; margin-bottom: 50px; }

        /* Memories */
        .memories-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px;
        }
        .memory-card {
            position: relative; height: 320px; border-radius: 15px; overflow: hidden;
            box-shadow: var(--shadow); cursor: pointer;
        }
        .memory-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .memory-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.95); padding: 20px;
            transform: translateY(100%); transition: transform 0.4s ease; text-align: center;
        }
        .memory-card:hover img { transform: scale(1.1); }
        .memory-card:hover .memory-overlay { transform: translateY(0); }

        /* Notes */
        .diary-paper {
            background: #fffdf5; padding: 40px; border-radius: 5px; box-shadow: var(--shadow);
            font-size: 1.2rem; line-height: 2; position: relative;
            background-image: linear-gradient(#eee .1rem, transparent .1rem);
            background-size: 100% 2rem; max-width: 800px; margin: 0 auto; transform: rotate(-1deg);
        }

        /* Journey */
        .timeline { 
            position: relative; 
            padding-left: 40px; 
            border-left: 4px solid var(--primary-color);
            margin-left: 20px;
        }
        .timeline-item { 
            margin-bottom: 50px; 
            position: relative; 
            padding-left: 25px; 
        }
        .timeline-item::before {
            content: '❤'; 
            position: absolute; 
            left: -50px; 
            top: 0;
            background: white; 
            color: var(--primary-color); 
            font-size: 1.8rem; 
            padding: 8px;
            border: 4px solid var(--primary-color);
            border-radius: 50%;
        }
        .timeline-content {
            background: white; 
            padding: 25px; 
            border-radius: 15px;
            box-shadow: var(--shadow); 
            display: flex; 
            gap: 25px; 
            align-items: center;
            flex-wrap: wrap;
        }
        .timeline-img { 
            width: 150px; 
            height: 150px; 
            object-fit: cover; 
            border-radius: 12px; 
            flex-shrink: 0;
        }

        /* Photos */
        .gallery-grid { 
            columns: 4 250px; 
            gap: 20px; 
        }
        .gallery-grid img { 
            width: 100%; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            transition: transform 0.3s;
            break-inside: avoid;
        }
        .gallery-grid img:hover { 
            transform: scale(1.03); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Special Note */
        .special-note-card {
            background: #fffdf9; 
            border-radius: 20px; 
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
            text-align: center;
            max-width: 600px; 
            margin: 40px auto; 
            border: 3px solid #f0e6d2;
        }
        .present-btn {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white; 
            padding: 15px 35px;
            border: none; 
            border-radius: 30px; 
            font-size: 1.2rem; 
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4); 
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .present-btn:hover { 
            transform: scale(1.05); 
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.6);
        }

        /* Footer */
        .footer-section { 
            text-align: center; 
            padding: 50px 20px; 
            margin-top: 50px; 
            border-top: 1px solid rgba(255,255,255,0.5); 
            background: rgba(255,255,255,0.1);
            border-radius: 30px 30px 0 0;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Animations */
        @keyframes pulse { 
            0%, 100% { opacity: 0.8; transform: scale(1); } 
            50% { opacity: 1; transform: scale(1.02); } 
        }
        @keyframes float { 
            0%, 100% { transform: translateY(0px); } 
            50% { transform: translateY(-15px); } 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Mobile */
        @media (max-width: 768px) {
            .title-glow { font-size: 3rem; }
            .subtitle-glow { font-size: 2rem; }
            .main-card-bg { height: 60vh; }
            .section-title { font-size: 2.5rem; }
            .timeline-content { flex-direction: column; }
            .timeline-img { width: 100%; height: 200px; }
            .gallery-grid { columns: 2; }
            .admin-link { top: 10px; right: 10px; padding: 8px 15px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="sticker-container" id="sticker-container"></div>


    <header>
        <div class="main-card-bg" id="mainCard">
            <h1 class="title-glow" id="mainTitle">Loading...</h1>
            <h2 class="subtitle-glow" id="subTitle">Loading...</h2>
            <p id="birthdayPerson" style="font-size: 1.5rem; color: #666; margin-top: 20px; font-family: 'Dancing Script', cursive;"></p>
        </div>

        <div class="nav-container">
            <button class="nav-btn" onclick="openSection('memories')">Memories</button>
            <button class="nav-btn" onclick="openSection('notes')">Notes</button>
            <button class="nav-btn" onclick="openSection('journey')">Journey</button>
            <button class="nav-btn" onclick="openSection('photos')">Photos</button>
            <button class="nav-btn" onclick="openSection('special-note')">Special</button>
        </div>
    </header>

    <!-- Loading Content -->
    <div id="loadingContent" class="loading">
        <div class="loading-spinner"></div>
        <p>Loading website content...</p>
    </div>

    <!-- Memories Section -->
    <div id="memories" class="content-section">
        <h2 class="section-title">Precious Memories</h2>
        <div class="memories-grid" id="memoriesContainer">
            <!-- Loaded from config.json -->
        </div>
    </div>

    <!-- Notes Section -->
    <div id="notes" class="content-section">
        <h2 class="section-title">A Note for You</h2>
        <div class="diary-paper">
            <p id="loveNoteText">
                Loading love note...
            </p>
        </div>
    </div>

    <!-- Journey Section -->
    <div id="journey" class="content-section">
        <h2 class="section-title">Our Journey</h2>
        <div class="timeline" id="journeyContainer">
            <!-- Loaded from config.json -->
        </div>
    </div>

    <!-- Photos Section -->
    <div id="photos" class="content-section">
        <h2 class="section-title">Gallery</h2>
        <div class="gallery-grid" id="photosContainer">
            <!-- Loaded from config.json -->
        </div>
    </div>

    <!-- Special Note Section -->
    <div id="special-note" class="content-section">
        <div class="special-note-card">
            <h2 class="note-title" style="font-family: 'Nunito'; color: #333;" id="specialNoteTitle">Loading...</h2>
            <p class="note-body" style="font-family: 'Nunito'; color: #666;" id="specialMessageText">
                Loading special message...
            </p>
            <button class="present-btn" id="surpriseButton">Click here 🎁</button>
            <div id="realGiftInfo" style="margin-top: 20px; padding: 15px; background: #f9f5f0; border-radius: 10px; display: none;"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-section">
        <p style="margin-bottom: 10px;" id="footerText">🎵 Made with love</p>
        <audio controls style="border-radius: 30px; outline: none;" id="audioPlayer">
            <source src="" type="audio/mpeg">
        </audio>
        <p style="margin-top: 20px; color: #888; font-size: 0.9rem;" id="lastUpdated"></p>
    </footer>

    <script>
        // Default data structure
        const defaultData = {
            header: {
                title: "Happy Birthday",
                subtitle: "My Dearest Love",
                background: "https://png.pngtree.com/png-clipart/20240619/original/pngtree-blank-paper-text-box-template-design-with-love-icon-suitable-for-png-image_15369747.png",
                birthdayPerson: ""
            },
            loveNote: "My Love,<br><br>Happy Birthday! Looking back at all our time together, I realize how lucky I am. You are the calm in my chaos and the smile on my face.<br><br>This year, I wish you all the happiness in the world. I love you endlessly.<br><br>Yours forever.",
            memories: [],
            journey: [],
            photos: [],
            specialNote: {
                title: "A Surprise...",
                message: "I wanted to do something special for you.<br>Click below! ✨",
                button: "Click here 🎁",
                alert: "Your surprise is a big hug and lots of love! (and maybe a real gift later!)",
                realGift: ""
            },
            footer: {
                text: "🎵 Play our song",
                audio: ""
            },
            lastUpdated: new Date().toLocaleString()
        };

        let websiteData = { ...defaultData };

        // Load data from config.json
        async function loadData() {
            try {
                const response = await fetch('config.json?t=' + new Date().getTime());
                
                if (!response.ok) {
                    // If config.json doesn't exist, create it with default data
                    if (response.status === 404) {
                        await createDefaultConfig();
                        websiteData = { ...defaultData };
                    } else {
                        throw new Error('Failed to load config');
                    }
                } else {
                    const data = await response.json();
                    websiteData = { ...defaultData, ...data };
                }
                
                updateWebsite();
                document.getElementById('loadingContent').style.display = 'none';
                
            } catch (error) {
                console.error('Error loading data:', error);
                websiteData = { ...defaultData };
                updateWebsite();
                document.getElementById('loadingContent').style.display = 'none';
            }
        }

        // Create default config.json if it doesn't exist
        async function createDefaultConfig() {
            try {
                const response = await fetch('save-config.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(defaultData)
                });
                
                if (!response.ok) {
                    console.warn('Could not create config file. Using default data.');
                }
            } catch (error) {
                console.warn('Could not create config file:', error);
            }
        }

        // Update website with current data
        function updateWebsite() {
            // Header
            document.getElementById('mainTitle').textContent = websiteData.header.title;
            document.getElementById('subTitle').textContent = websiteData.header.subtitle;
            
            if (websiteData.header.background) {
                document.getElementById('mainCard').style.backgroundImage = `url('${websiteData.header.background}')`;
            }
            
            document.getElementById('birthdayPerson').textContent = websiteData.header.birthdayPerson;

            // Love Note
            document.getElementById('loveNoteText').innerHTML = websiteData.loveNote;

            // Memories
            renderMemories();

            // Journey
            renderJourney();

            // Photos
            renderPhotos();

            // Special Note
            document.getElementById('specialNoteTitle').textContent = websiteData.specialNote.title;
            document.getElementById('specialMessageText').innerHTML = websiteData.specialNote.message;
            document.getElementById('surpriseButton').textContent = websiteData.specialNote.button;
            document.getElementById('surpriseButton').onclick = () => alert(websiteData.specialNote.alert);
            
            if (websiteData.specialNote.realGift) {
                document.getElementById('realGiftInfo').innerHTML = `<strong>Real Gift:</strong> ${websiteData.specialNote.realGift}`;
                document.getElementById('realGiftInfo').style.display = 'block';
            }

            // Footer
            document.getElementById('footerText').textContent = websiteData.footer.text;
            if (websiteData.footer.audio) {
                const audioPlayer = document.getElementById('audioPlayer');
                audioPlayer.querySelector('source').src = websiteData.footer.audio;
                audioPlayer.load();
            }
            
            document.getElementById('lastUpdated').textContent = `Last updated: ${websiteData.lastUpdated}`;
        }

        // Render memories
        function renderMemories() {
            const container = document.getElementById('memoriesContainer');
            container.innerHTML = '';
            
            if (!websiteData.memories || websiteData.memories.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; font-style: italic;">No memories added yet.</p>';
                return;
            }
            
            websiteData.memories.forEach(memory => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.innerHTML = `
                    <img src="${memory.img}" alt="${memory.title}" onerror="this.src='https://via.placeholder.com/400x300?text=Memory'">
                    <div class="memory-overlay">
                        <h3>${memory.title}</h3>
                        <p style="color: #666; margin-top: 5px;">${memory.date}</p>
                        ${memory.description ? `<p style="margin-top: 10px; font-size: 0.9rem;">${memory.description}</p>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Render journey
        function renderJourney() {
            const container = document.getElementById('journeyContainer');
            container.innerHTML = '';
            
            if (!websiteData.journey || websiteData.journey.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; font-style: italic;">No journey items added yet.</p>';
                return;
            }
            
            const sortedJourney = [...websiteData.journey].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            sortedJourney.forEach(item => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                timelineItem.innerHTML = `
                    <div class="timeline-content">
                        <img src="${item.img}" class="timeline-img" alt="${item.title}" onerror="this.src='https://via.placeholder.com/150?text=Journey'">
                        <div>
                            <h3>${item.title}</h3>
                            <p style="color: #666; margin: 5px 0;">${item.date}</p>
                            <p>${item.description}</p>
                        </div>
                    </div>
                `;
                container.appendChild(timelineItem);
            });
        }

        // Render photos
        function renderPhotos() {
            const container = document.getElementById('photosContainer');
            container.innerHTML = '';
            
            if (!websiteData.photos || websiteData.photos.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; font-style: italic;">No photos added yet.</p>';
                return;
            }
            
            websiteData.photos.forEach(photo => {
                const img = document.createElement('img');
                img.src = photo;
                img.alt = "Memory photo";
                img.onerror = function() {
                    this.src = 'https://via.placeholder.com/400x300?text=Photo+Error';
                };
                container.appendChild(img);
            });
        }

        // Section navigation
        function openSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active-section'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            const target = document.getElementById(sectionId);
            if (target) {
                target.classList.add('active-section');
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            event.currentTarget.classList.add('active');
        }

        // Create floating stickers
        function createSticker() {
            const container = document.getElementById('sticker-container');
            const emojis = ['❤️', '💖', '✨', '🌸', '🦋', '🎂', '😍', '🥰', '🎉', '🎁', '💕', '💐'];
            const sticker = document.createElement('div');
            sticker.classList.add('sticker');
            sticker.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            sticker.style.left = Math.random() * 100 + 'vw';
            sticker.style.animationDuration = (Math.random() * 3 + 4) + 's'; 
            sticker.style.fontSize = (Math.random() * 20 + 20) + 'px'; 
            container.appendChild(sticker);
            setTimeout(() => sticker.remove(), 7000);
        }

        // Initialize
        window.onload = function() {
            loadData();
            setInterval(createSticker, 500);
            
            // Auto-refresh data every 10 seconds
            setInterval(loadData, 10000);
        };
    </script>
</body>
</html>
